[project]
name = "async-payment-processing-service"
version = "0.1.0"
description = "Асинхронный сервис обработки платежей"
readme = "README.md"
authors = [{name = "Titov Vitaly", email = "good.tivi.2001@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[cli,rabbit]>=0.6,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.0.41,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1,<2",
    "pre-commit>=4.3.0",
    "ruff==0.15.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: требует PostgreSQL и/или RabbitMQ",
    "broker: требует TEST_RABBITMQ_URL и TEST_RABBITMQ_HTTP_URL",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
